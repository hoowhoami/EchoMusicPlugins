            <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>

        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
        </filter>
    </defs>

    <rect width="512" height="512" rx="115" fill="url(#bgBase)"/>
    <rect width="512" height="512" rx="115" fill="url(#bgOverlay)"/>

    <g filter="url(#dropShadow)">
