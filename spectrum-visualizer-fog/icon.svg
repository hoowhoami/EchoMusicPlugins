<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5B6B"/>
            <stop offset="100%" stop-color="#1A8DF5"/>
        </linearGradient>
        
        <linearGradient id="bgOverlay" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FF83A4" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#A439C9" stop-opacity="0"/>
            <stop offset="100%" stop-color="#5B1BD8" stop-opacity="0.95"/>
        </linearGradient>

        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
