                 L 422,256"
              transform="translate(0, -3)" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
              
        <path d="M 90,256 
                 L 131,256 
                 C 146,256 146,160 161,160 
                 C 181,160 181,330 201,330 
                 C 226,330 226,100 251,100 
                 C 276,100 276,400 301,400 
